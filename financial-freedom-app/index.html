<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9f1eb"><title>folio. — Personal finance</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#173d33;background:#e9f1eb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9a7ce0;outline-offset:2px}button:active{transform:scale(.975)}.shell{max-width:1120px;margin:auto;padding:26px 22px 110px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:27px}.logo{font-weight:850;font-size:31px;letter-spacing:-2px}.top-right{display:flex;gap:9px;align-items:center}.tag{border:1px solid #c8dcd1;color:#50776b;padding:8px 12px;border-radius:99px;font-size:12px}.nav{display:flex;gap:6px;background:#f7faf6;border:1px solid #dce9df;padding:6px;border-radius:15px;max-width:max-content;margin-bottom:28px}.nav button{border:0;background:transparent;padding:11px 17px;border-radius:11px;color:#627e72;font-size:13px;font-weight:650}.nav button.active{background:#1c5345;color:white;box-shadow:0 4px 13px #1c534524}.hero{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}.panel{background:#fffefa;border:1px solid #dce8df;border-radius:20px;padding:23px;box-shadow:0 8px 24px #193c2810}.deep{background:#194f42;color:#fff;border:0}.lilac{background:#e6def8;border:0;color:#483278}.mint{background:#d7ecdf;border:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:750;color:#769083}.deep .eyebrow{color:#a9d5bf}.big{font-size:clamp(36px,5vw,57px);font-weight:760;letter-spacing:-2.8px;margin:14px 0 8px}.deep .big{color:#f4fff7}.muted{color:#738b7e;font-size:13px;line-height:1.55}.deep .muted{color:#bdd7c9}h1{font-size:29px;letter-spacing:-1.2px;margin:0 0 7px}h2{font-size:18px;letter-spacing:-.5px;margin:0}h3{font-size:15px;margin:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:27px 0 13px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.number{font-size:27px;font-weight:730;letter-spacing:-1px;margin:9px 0}.line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #edf0eb}.line:last-child{border:0}.btn{border:0;background:#1d5546;color:white;border-radius:11px;padding:11px 16px;font-weight:700;font-size:13px;transition:background .2s,transform .15s,box-shadow .2s}.btn:hover{background:#2d7059;box-shadow:0 5px 16px #21584320}.btn.alt{background:#e7e0f6;color:#513c80}.btn.alt:hover{background:#d7c9f1}.btn.ghost{background:#f0f5ef;color:#285546}.btn.danger{background:#fae6e3;color:#8e4339}.btn.small{padding:8px 11px;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:8px}.progress{height:7px;background:#e6eee8;border-radius:99px;overflow:hidden;margin-top:13px}.progress>div{height:100%;background:#39866b;border-radius:99px;transition:width .65s cubic-bezier(.2,.7,.2,1)}.progress.purple>div{background:#9576bd}.goal{position:relative;overflow:hidden;transition:box-shadow .3s,border-color .3s}.goal.complete{border-color:#a8d5b4}.goal.celebrate{animation:glow 2s ease-in-out}.goal.celebrate:after{content:"";position:absolute;inset:-50%;background:linear-gradient(110deg,transparent 43%,#ffffff99 49%,transparent 55%);transform:translateX(-110%);animation:sweep 1.6s ease-out forwards;pointer-events:none}@keyframes glow{0%,100%{box-shadow:0 8px 24px #193c2810}35%{box-shadow:0 0 0 5px #c1e8bf,0 0 32px #88cc93}}@keyframes sweep{to{transform:translateX(110%)}}.chart{height:145px;width:100%;display:block;margin-top:10px}.view{display:none;animation:enter .28s ease-out}.view.active{display:block}@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#557467}.field input,.field select,.field textarea{width:100%;border:1px solid #cfdfd3;border-radius:10px;padding:11px 12px;background:#fff;color:#173d33;font-weight:500}.field textarea{min-height:80px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-grid .full{grid-column:1/-1}.modal-back{position:fixed;inset:0;background:#0b251c8a;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal-back.show{display:flex}.modal{background:#fffefa;border-radius:20px;padding:24px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 25px 80px #071c1450}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#789082;padding:12px 9px}.table td{padding:13px 9px;border-top:1px solid #e9eee8;white-space:nowrap}.table td:last-child,.table th:last-child{text-align:right}.pill{font-size:11px;background:#e9f2ec;padding:5px 8px;border-radius:99px;color:#467560}.empty{padding:22px;text-align:center;color:#789082;background:#f6f8f4;border-radius:12px;font-size:13px}.bottom{display:none}.note{padding:13px 15px;background:#f1f5f0;border-radius:12px;color:#58756a;font-size:12px;line-height:1.6}.hide{display:none!important}.flex{display:flex;align-items:center;gap:9px}.right{margin-left:auto}.money-pos{color:#237958}.money-neg{color:#a35b54}.switch{border:0;background:transparent;color:#6c8177;font-size:12px;text-decoration:underline;padding:4px}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#173f34;color:white;padding:12px 19px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}.toast.show{opacity:1}@media(max-width:700px){.shell{padding:19px 15px 115px}.hero,.grid2,.grid3{grid-template-columns:1fr}.nav{display:none}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;justify-content:space-around;background:#fffefbf5;border-top:1px solid #dbe6dc;padding:10px 4px calc(11px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(16px)}.bottom button{border:0;background:transparent;color:#799085;font-size:11px;font-weight:650;padding:8px 7px;border-radius:9px}.bottom button.active{color:#1b5544;background:#e5f0e9}.panel{padding:18px}.top{margin-bottom:20px}.tag{font-size:10px}.big{font-size:43px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="shell">
<header class="top"><div class="logo">folio.</div><div class="top-right"><span class="tag">Your money, your pace.</span><button class="btn small" onclick="openAdd()">+ Add</button></div></header>
<nav class="nav" id="nav"></nav>
<section class="view active" id="home"></section><section class="view" id="plan"></section><section class="view" id="accounts"></section><section class="view" id="transactions"></section><section class="view" id="goals"></section><section class="view" id="more"></section>
</main><nav class="bottom" id="bottom"></nav><div class="modal-back" id="back" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><input type="file" id="importFile" accept=".json,.csv,.txt,.xlsx,.xls,.docx" hidden onchange="importFile(event)">
<script>
const KEY="folio-v1-data",tabs=["home","plan","accounts","transactions","goals","more"],labels=["Home","Plan","Accounts","Activity","Goals","More"];
const seed=()=>({version:1,accounts:[],transactions:[],goals:[],budgets:[{name:"Housing",amount:0},{name:"Groceries",amount:0},{name:"Dining & fun",amount:0},{name:"Transport",amount:0},{name:"Pets",amount:0},{name:"Other",amount:0}],income:0,bonus:0,bonusMonths:[],startMonth:new Date().toISOString().slice(0,7),months:14,notes:{},events:[],onboarded:false});
let data;try{data=Object.assign(seed(),JSON.parse(localStorage.getItem(KEY)||"null")||{})}catch{data=seed()}
let tab="home",expanded=false;const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(Number(n)||0),num=n=>Number(n)||0,uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2300)}
function nav(){for(let id of ["nav","bottom"])$(id).innerHTML=tabs.map((t,i)=>'<button class="'+(tab===t?"active":"")+'" onclick="go(\''+t+'\')">'+labels[i]+'</button>').join("")}
function go(t){tab=t;nav();render();window.scrollTo({top:0,behavior:"smooth"})}
function sumAccounts(){return data.accounts.reduce((s,a)=>s+(a.type==="debt"?-num(a.balance):num(a.balance)),0)}
function spend(){return data.budgets.reduce((s,b)=>s+num(b.amount),0)}
function totalTransactions(){return data.transactions.reduce((s,t)=>s+(t.kind==="income"?num(t.amount):-num(t.amount)),0)}
function cash(){return data.accounts.filter(a=>a.type==="cash").reduce((s,a)=>s+num(a.balance),0)}
function forecast(){let bal=cash(),arr=[];let start=data.startMonth||new Date().toISOString().slice(0,7);let [y,m]=start.split("-").map(Number);for(let i=0;i<Math.min(60,Math.max(1,num(data.months)||14));i++){let date=new Date(y,m-1+i,1),key=date.toISOString().slice(0,7),event=data.events.filter(e=>e.month===key).reduce((s,e)=>s+(e.kind==="income"?num(e.amount):-num(e.amount)),0);let bonus=(data.bonusMonths||[]).includes(key)?num(data.bonus):0;bal+=num(data.income)+bonus-spend()+event;arr.push({key,label:date.toLocaleDateString("en-US",{month:"short",year:"2-digit"}),balance:bal,bonus,event})}return arr}
function chart(points){if(!points.length)return"";let values=points.map(p=>p.balance),min=Math.min(...values),max=Math.max(...values),range=Math.max(1,max-min),w=600,h=135;let coords=values.map((v,i)=>(i/(Math.max(1,values.length-1))*w).toFixed(1)+","+(h-8-(v-min)/range*(h-24)).toFixed(1));return '<svg class="chart" viewBox="0 0 600 145" preserveAspectRatio="none" aria-label="Projected cash balance chart"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b5e2c4" stop-opacity=".5"/><stop offset="1" stop-color="#b5e2c4" stop-opacity="0"/></linearGradient></defs><polygon points="0,145 '+coords.join(" ")+' 600,145" fill="url(#cg)"/><polyline points="'+coords.join(" ")+'" fill="none" stroke="#3d9b79" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/></svg>'}
function render(){nav();tabs.forEach(t=>$(t).classList.toggle("active",tab===t));let fc=forecast(),net=sumAccounts(),active=data.goals.filter(g=>!g.paused),done=data.goals.filter(g=>num(g.saved)>=num(g.target)&&num(g.target)>0);
$("home").innerHTML='<div class="hero"><div class="panel deep"><div class="eyebrow">Your financial picture</div><div class="big">'+fmt(net)+'</div><div class="muted">Total across your accounts, less debts</div>'+chart(fc)+'<div class="flex" style="justify-content:space-between;font-size:11px;color:#c4dece"><span>'+esc(fc[0]?.label||"")+'</span><span>'+esc(fc.at(-1)?.label||"")+' projected cash</span></div></div><div class="panel"><div class="eyebrow">Monthly breathing room</div><div class="number">'+fmt(num(data.income)-spend())+'</div><div class="muted">Income minus your planned spending, before bonuses and one-offs.</div><div class="line"><span>Monthly income</span><strong>'+fmt(data.income)+'</strong></div><div class="line"><span>Planned expenses</span><strong>'+fmt(spend())+'</strong></div><div class="actions" style="margin-top:15px"><button class="btn alt" onclick="go(\'plan\')">Adjust your plan</button></div></div></div><div class="section-head"><h2>At a glance</h2><button class="switch" onclick="go(\'accounts\')">All accounts →</button></div><div class="grid3"><div class="panel"><div class="eyebrow">Cash accounts</div><div class="number">'+fmt(cash())+'</div><div class="muted">'+data.accounts.filter(a=>a.type==="cash").length+' accounts</div></div><div class="panel lilac"><div class="eyebrow">Goals in motion</div><div class="number">'+active.length+'</div><div class="muted">'+done.length+' completed</div></div><div class="panel mint"><div class="eyebrow">Next month forecast</div><div class="number">'+fmt(fc[0]?.balance||cash())+'</div><div class="muted">Planning estimate, not a bank balance</div></div></div><div class="section-head"><h2>Your goals</h2><button class="switch" onclick="go(\'goals\')">View goals →</button></div><div class="grid2">'+(active.length?active.slice(0,2).map(goalCard).join(""):'<div class="panel"><div class="muted">Add a goal when something matters to you. No pressure, no streaks.</div><div style="margin-top:12px"><button class="btn small" onclick="goalForm()">Create goal</button></div></div>')+'</div>';
$("accounts").innerHTML='<div class="section-head"><div><h1>Accounts</h1><div class="muted">A place for everything you track.</div></div><button class="btn" onclick="accountForm()">+ Account</button></div><div class="grid2">'+(data.accounts.length?data.accounts.map(a=>'<div class="panel"><div class="flex"><h3>'+esc(a.name)+'</h3><span class="pill right">'+(a.type==="debt"?"Debt":a.type==="invest"?"Investment":"Cash")+'</span></div><div class="number">'+fmt(a.balance)+'</div><div class="actions"><button class="btn ghost small" onclick="accountForm(\''+a.id+'\')">Edit balance</button><button class="btn danger small" onclick="removeItem(\'accounts\',\''+a.id+'\')">Remove</button></div></div>').join(""):'<div class="panel"><div class="empty">No accounts yet. Add checking, savings, investments, or a loan.</div></div>')+'</div><div class="note" style="margin-top:16px">Manual balances are your source of truth. Transactions are recorded separately and do not automatically alter account balances; update balances when you reconcile with your bank.</div>';
$("transactions").innerHTML='<div class="section-head"><div><h1>Activity</h1><div class="muted">Keep a simple record of what happened.</div></div><button class="btn" onclick="transactionForm()">+ Transaction</button></div><div class="panel table-wrap">'+(data.transactions.length?'<table class="table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr></thead><tbody>'+data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>'<tr><td>'+esc(t.date)+'</td><td>'+esc(t.name)+'</td><td>'+esc(t.category||"—")+'</td><td class="'+(t.kind==="income"?"money-pos":"money-neg")+'">'+(t.kind==="income"?"+":"−")+fmt(t.amount)+'</td><td><button class="switch" onclick="removeItem(\'transactions\',\''+t.id+'\')">Delete</button></td></tr>').join("")+'</tbody></table>':'<div class="empty">Nothing recorded yet. Add transactions manually or import a CSV.</div>')+'</div>';
$("plan").innerHTML='<div class="section-head"><div><h1>Your plan</h1><div class="muted">Make room for real life, not just perfect months.</div></div><button class="btn" onclick="eventForm()">+ One-off</button></div><div class="grid2"><div class="panel"><h2>Income & forecast</h2><div class="form-grid" style="margin-top:16px"><label class="field">Monthly take-home<input type="number" min="0" step=".01" value="'+num(data.income)+'" onchange="setPlan(\'income\',this.value)"></label><label class="field">Bonus take-home<input type="number" min="0" step=".01" value="'+num(data.bonus)+'" onchange="setPlan(\'bonus\',this.value)"></label><label class="field">Forecast starts<input type="month" value="'+esc(data.startMonth)+'" onchange="setPlan(\'startMonth\',this.value)"></label><label class="field">Months ahead<input type="number" min="1" max="60" value="'+num(data.months)+'" onchange="setPlan(\'months\',this.value)"></label></div><div class="muted" style="margin-top:12px">Bonus months: '+esc((data.bonusMonths||[]).join(", ")||"None scheduled")+'</div><button class="btn alt small" style="margin-top:10px" onclick="bonusForm()">Edit bonus months</button></div><div class="panel"><h2>Monthly budget</h2>'+data.budgets.map((b,i)=>'<div class="line"><span>'+esc(b.name)+'</span><label class="field" style="width:125px"><input aria-label="'+esc(b.name)+' budget" type="number" min="0" step=".01" value="'+num(b.amount)+'" onchange="setBudget('+i+',this.value)"></label></div>').join("")+'<div class="line"><strong>Total</strong><strong>'+fmt(spend())+'</strong></div><button class="btn ghost small" onclick="budgetForm()">Edit categories</button></div></div><div class="section-head"><h2>Monthly outlook</h2><span class="muted">Cash accounts only · estimated</span></div><div class="panel table-wrap"><table class="table"><thead><tr><th>Month</th><th>Salary</th><th>Bonus</th><th>Budget</th><th>One-offs</th><th>Projected cash</th></tr></thead><tbody>'+fc.map(f=>'<tr><td>'+esc(f.label)+'</td><td>'+fmt(data.income)+'</td><td>'+fmt(f.bonus)+'</td><td>−'+fmt(spend())+'</td><td>'+(f.event<0?"−":"+")+fmt(Math.abs(f.event))+'</td><td><strong>'+fmt(f.balance)+'</strong></td></tr>').join("")+'</tbody></table></div><div class="section-head"><h2>One-off changes</h2><button class="btn ghost small" onclick="eventForm()">+ Add</button></div><div class="panel">'+(data.events.length?data.events.map(e=>'<div class="line"><span>'+esc(e.month)+' · '+esc(e.name)+'</span><span>'+ (e.kind==="income"?"+":"−")+fmt(e.amount)+' <button class="switch" onclick="removeItem(\'events\',\''+e.id+'\')">Remove</button></span></div>').join(""):'<div class="empty">Trips, moving costs, gifts, unexpected income — add them here.</div>')+'</div><div class="note" style="margin-top:16px">This is a cash-flow estimate. It does not calculate loan interest, taxes, or automatically transfer money between accounts. Reconcile actual balances regularly.</div>';
$("goals").innerHTML='<div class="section-head"><div><h1>Your goals</h1><div class="muted">Your pace, your plan.</div></div><button class="btn" onclick="goalForm()">+ Goal</button></div><div class="grid2">'+(active.length?active.map(goalCard).join(""):'<div class="panel"><div class="empty">No active goals. Add one whenever you feel ready.</div></div>')+'</div><div class="panel" style="margin-top:16px;background:#f8f8f2"><div class="flex" style="justify-content:space-between;cursor:pointer" onclick="expanded=!expanded;render()"><div><h3>When I\'m ready ♡</h3><div class="muted">A little space for later · '+data.goals.filter(g=>g.paused).length+' resting</div></div><span>'+ (expanded?"−":"+")+'</span></div>'+(expanded?'<div style="margin-top:12px">'+(data.goals.filter(g=>g.paused).map(goalCard).join("")||'<div class="muted">Nothing here right now.</div>')+'</div>':"")+'</div>';
$("more").innerHTML='<div class="section-head"><div><h1>More</h1><div class="muted">Your data belongs to you.</div></div></div><div class="grid2"><div class="panel"><h2>Bring your data</h2><p class="muted">Import a Folio backup, CSV transactions, plain-text notes, Excel workbook, or Word document. Review imported information afterward.</p><div class="actions"><button class="btn" onclick="$(\'importFile\').click()">Import file</button><button class="btn alt" onclick="downloadBackup()">Export backup</button><button class="btn ghost" onclick="downloadCSV()">Export transactions CSV</button></div></div><div class="panel"><h2>Privacy & storage</h2><p class="muted">This release stores your data only in this browser on this device. There is no login, bank connection, or cross-device sync. Clearing browser data can erase it.</p><div class="actions"><button class="btn danger" onclick="resetData()">Reset local data</button></div></div></div><div class="panel" style="margin-top:16px"><h2>What's next</h2><p class="muted">Separate user accounts, private cloud sync, household sharing, permission controls, and optional connected banking are future releases—not enabled in v1.</p></div>';
}
function goalCard(g){let pct=num(g.target)>0?Math.min(100,Math.max(0,num(g.saved)/num(g.target)*100)):0,complete=pct===100;return '<div class="panel goal '+(complete?"complete":"")+'" id="goal-'+g.id+'"><div class="flex" style="justify-content:space-between"><h3>'+esc(g.name)+'</h3>'+(complete?'<span class="pill">Completed</span>':'')+'</div><div class="number">'+fmt(g.saved)+' <span class="muted" style="font-weight:500">of '+fmt(g.target)+'</span></div><div class="progress '+(g.color==="purple"?"purple":"")+'"><div style="width:'+pct+'%"></div></div><div class="actions" style="margin-top:17px"><button class="btn ghost small" onclick="goalForm(\''+g.id+'\')">Edit</button><button class="btn alt small" onclick="togglePause(\''+g.id+'\')">'+(g.paused?"Bring back":"Pause for now")+'</button><button class="btn danger small" onclick="removeItem(\'goals\',\''+g.id+'\')">Remove</button></div></div>'}
function modal(title,content){$("modal").innerHTML='<div class="modal-head"><h2>'+title+'</h2><button class="btn ghost small" onclick="closeModal()">Close</button></div>'+content;$("back").classList.add("show")}function closeModal(){$("back").classList.remove("show")}
function field(label,name,value="",type="text",extra=""){return '<label class="field">'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+' required></label>'}
function accountForm(id){let a=data.accounts.find(x=>x.id===id)||{name:"",balance:0,type:"cash"};modal(id?"Edit account":"Add account",'<form onsubmit="saveAccount(event,\''+(id||"")+'\')"><div class="form-grid">'+field("Account name","name",a.name)+field("Current balance","balance",a.balance,"number",'step=".01" min="0"')+'<label class="field full">Account type<select name="type"><option value="cash" '+(a.type==="cash"?"selected":"")+'>Checking / savings / cash</option><option value="invest" '+(a.type==="invest"?"selected":"")+'>Investments</option><option value="debt" '+(a.type==="debt"?"selected":"")+'>Loan / credit card</option></select></label></div><button class="btn" style="margin-top:20px">Save account</button></form>')}
function saveAccount(e,id){e.preventDefault();let f=e.target,a={id:id||uid(),name:f.elements["name"].value.trim(),balance:num(f.elements["balance"].value),type:f.elements["type"].value};if(id)data.accounts=data.accounts.map(x=>x.id===id?a:x);else data.accounts.push(a);save();closeModal();render();toast("Account saved")}
function transactionForm(){modal("Add transaction",'<form onsubmit="saveTransaction(event)"><div class="form-grid">'+field("Description","name","")+field("Amount","amount",0,"number",'min="0.01" step=".01"')+field("Date","date",new Date().toISOString().slice(0,10),"date")+'<label class="field">Type<select name="kind"><option value="expense">Expense</option><option value="income">Income</option></select></label>'+field("Category","category","Other")+'</div><button class="btn" style="margin-top:20px">Save transaction</button></form>')}
function saveTransaction(e){e.preventDefault();let f=e.target;data.transactions.push({id:uid(),name:f.elements["name"].value,date:f.elements["date"].value,kind:f.elements["kind"].value,category:f.elements["category"].value,amount:num(f.elements["amount"].value)});save();closeModal();render();toast("Transaction recorded")}
function goalForm(id){let g=data.goals.find(x=>x.id===id)||{name:"",target:1000,saved:0,color:"green"};modal(id?"Edit goal":"Create goal",'<form onsubmit="saveGoal(event,\''+(id||"")+'\')"><div class="form-grid">'+field("Goal name","name",g.name)+field("Target amount","target",g.target,"number",'min="1" step=".01"')+field("Saved so far","saved",g.saved,"number",'min="0" step=".01"')+'<label class="field">Progress color<select name="color"><option value="green">Forest green</option><option value="purple" '+(g.color==="purple"?"selected":"")+'>Violet</option></select></label></div><button class="btn" style="margin-top:20px">Save goal</button></form>')}
function saveGoal(e,id){e.preventDefault();let f=e.target,prev=data.goals.find(g=>g.id===id),g={id:id||uid(),name:f.elements["name"].value,target:num(f.elements["target"].value),saved:num(f.elements["saved"].value),color:f.elements["color"].value,paused:prev?.paused||false};let crossed=num(g.saved)>=num(g.target)&&(!prev||num(prev.saved)<num(prev.target));if(id)data.goals=data.goals.map(x=>x.id===id?g:x);else data.goals.push(g);save();closeModal();go("goals");if(crossed){let el=$("goal-"+g.id);if(el){el.classList.add("celebrate");setTimeout(()=>el.classList.remove("celebrate"),2000)}toast("Milestone reached. Beautifully done.")}else toast("Goal saved")}
function togglePause(id){let g=data.goals.find(x=>x.id===id);if(g){g.paused=!g.paused;save();render();toast(g.paused?"Tucked away for later":"Welcome back")}}
function removeItem(type,id){if(!confirm("Remove this item?"))return;data[type]=data[type].filter(x=>x.id!==id);save();render()}
function setPlan(k,v){data[k]=["startMonth"].includes(k)?v:num(v);save();render()}function setBudget(i,v){data.budgets[i].amount=Math.max(0,num(v));save();render()}
function budgetForm(){modal("Edit budget categories",'<form onsubmit="saveBudgetNames(event)">'+data.budgets.map((b,i)=>'<div style="margin-bottom:12px">'+field("Category "+(i+1),"b"+i,b.name)+'</div>').join("")+'<button class="btn">Save names</button></form>')}
function saveBudgetNames(e){e.preventDefault();data.budgets.forEach((b,i)=>b.name=e.target.elements["b"+i].value);save();closeModal();render()}
function eventForm(){modal("Add one-off change",'<form onsubmit="saveEvent(event)"><div class="form-grid">'+field("Description","name","")+field("Month","month",new Date().toISOString().slice(0,7),"month")+field("Amount","amount",100,"number",'min="0.01" step=".01"')+'<label class="field">Type<select name="kind"><option value="expense">Extra expense</option><option value="income">Extra income</option></select></label></div><button class="btn" style="margin-top:20px">Add to plan</button></form>')}
function saveEvent(e){e.preventDefault();let f=e.target;data.events.push({id:uid(),name:f.elements["name"].value,month:f.elements["month"].value,amount:num(f.elements["amount"].value),kind:f.elements["kind"].value});save();closeModal();render()}
function bonusForm(){modal("Bonus months",'<form onsubmit="saveBonuses(event)"><label class="field">Months (YYYY-MM, separated by commas)<textarea name="months" placeholder="2027-03, 2027-06">'+esc((data.bonusMonths||[]).join(", "))+'</textarea></label><button class="btn" style="margin-top:16px">Save months</button></form>')}
function saveBonuses(e){e.preventDefault();data.bonusMonths=e.target.elements["months"].value.split(/[,;\n]+/).map(s=>s.trim()).filter(s=>/^\d{4}-(0[1-9]|1[0-2])$/.test(s));save();closeModal();render()}
function openAdd(){modal("Add to Folio",'<div class="grid2"><button class="btn" onclick="accountForm()">Account</button><button class="btn alt" onclick="transactionForm()">Transaction</button><button class="btn ghost" onclick="goalForm()">Goal</button><button class="btn ghost" onclick="eventForm()">One-off expense / income</button></div>')}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadBackup(){download("folio-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify({format:"folio-v1",data},null,2),"application/json")}
function downloadCSV(){let rows=[["date","description","category","type","amount"],...data.transactions.map(t=>[t.date,t.name,t.category,t.kind,t.amount])];download("folio-transactions.csv",rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\n"),"text/csv")}
function resetData(){if(!confirm("Erase all Folio data saved in this browser? Export a backup first."))return;data=seed();save();go("home")}
function csvParse(s){let out=[],row=[],cell="",q=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===","&&!q){row.push(cell);cell=""}else if((c==="\n"||c==="\r")&&!q){if(c==="\r"&&s[i+1]==="\n")i++;row.push(cell);if(row.some(x=>x.trim()))out.push(row);row=[];cell=""}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))out.push(row);return out}
function importRows(rows){if(rows.length<2)throw Error("No rows found");let headers=rows[0].map(s=>String(s).trim().toLowerCase()),idx=(...names)=>headers.findIndex(h=>names.some(n=>h.includes(n))),date=idx("date"),desc=idx("description","merchant","payee","memo","name"),amount=idx("amount","total"),category=idx("category"),kind=idx("type","kind");if(amount<0||desc<0)throw Error("Include description/name and amount columns");let count=0;for(let r of rows.slice(1)){let v=Number(String(r[amount]||"").replace(/[$,]/g,""));if(!Number.isFinite(v)||v===0)continue;let type=kind>=0&&/income|credit|deposit/i.test(r[kind])?"income":v<0?"expense":"expense";data.transactions.push({id:uid(),date:date>=0&&/^\d{4}-\d{2}-\d{2}/.test(r[date])?r[date].slice(0,10):new Date().toISOString().slice(0,10),name:String(r[desc]||"Imported item"),category:category>=0?String(r[category]):"Imported",kind:type,amount:Math.abs(v)});count++}return count}
function importNotes(s){let count=0;for(let line of s.split(/\r?\n/)){let m=line.match(/^\s*(?:account\s*[:\-]\s*)?([^:]+)\s*:\s*\$?([\d,]+(?:\.\d{1,2})?)\s*$/i);if(m){data.accounts.push({id:uid(),name:m[1].trim(),balance:num(m[2].replace(/,/g,"")),type:"cash"});count++}}return count}
async function importFile(e){let file=e.target.files[0];e.target.value="";if(!file)return;try{let ext=file.name.split(".").pop().toLowerCase(),count=0;if(ext==="json"){let j=JSON.parse(await file.text());if(j.format==="folio-v1"&&j.data){if(!confirm("Replace all current data with this Folio backup?"))return;data=Object.assign(seed(),j.data);count=1}else if(j.data?.opening){throw Error("This is an older private plan format. Please convert it before importing.")}else throw Error("Not a Folio backup")}else if(ext==="csv"){count=importRows(csvParse(await file.text()))}else if(ext==="txt"){count=importNotes(await file.text())}else if(ext==="xlsx"||ext==="xls"){if(typeof XLSX==="undefined")throw Error("Excel parser unavailable. Export your sheet as CSV and try again.");let book=XLSX.read(await file.arrayBuffer(),{type:"array"});count=importRows(XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:""}))}else if(ext==="docx"){if(typeof mammoth==="undefined")throw Error("Word parser unavailable. Save as plain text and try again.");let res=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});count=importNotes(res.value)}else throw Error("Unsupported file");save();render();toast("Imported "+count+" item(s). Review your data.")}catch(err){alert("Import couldn't finish: "+err.message)}}
render();if(!data.onboarded){data.onboarded=true;save();modal("Welcome to Folio",'<p class="muted">Your money, your pace. Start with an account, enter a monthly budget, or import existing records. Everything stays in this browser until you choose to export it.</p><div class="actions"><button class="btn" onclick="closeModal();accountForm()">Add my first account</button><button class="btn alt" onclick="closeModal();go(\'more\')">Import data</button><button class="btn ghost" onclick="closeModal()">Explore first</button></div>')}
</script>
